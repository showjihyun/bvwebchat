# PR 게이트 — 활성. ADR-0001(스택 확정) 이후 실명령으로 채워졌다(2026-07-17).
# 원칙: 머지 게이트는 결정론적 센서(lint·test)만. 느린/추론적 검사는 게이트 밖.
# 추론적 검사(reviewer·evaluator)는 로컬 스킬이 맡고, 브랜치 보호가 이 잡을
# 필수 status check(`gate`)로 요구한다.
name: ci
on:
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # three-dot diff(M2·M3)의 merge-base 계산에 전체 이력이 필요.
          # 얕은 클론이면 "no merge base" 에러로 게이트가 오작동한다.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci

      - name: 스펙 동결 게이트 (Deep Interview 미완료 시 구현 차단)
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          PENDING=$(grep -cE '^- \*\*RQ-[0-9]+\*\* 🟡' specs/requirements.md || true)
          if [ "$PENDING" -gt 0 ] && echo "$CHANGED" | grep -qE '^(src/|tests?/|__tests__/)'; then
            echo "::error::Deep Interview 미완료 — requirements.md에 PENDING(🟡) ${PENDING}건. 구현(src/tests) 변경은 머지할 수 없습니다. specs/interview/question-bank.md로 인터뷰를 완료해 모든 🟡를 확정하세요."
            exit 1
          fi

      - name: 스펙-코드 동행 검사 (M2)
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -q '^src/' && ! echo "$CHANGED" | grep -qE '^(specs/|docs/adr/)'; then
            echo "::warning::코드 변경에 스펙/ADR 변경이 없습니다. 스펙에 이미 있는 항목인지 PR 설명에 RQ-ID를 명시하세요."
          fi

      # M3(테스트 선행률)은 여기서 재지 않는다. grep 프록시는 "테스트가 함께 바뀌었나"만
      # 볼 뿐 순서를 못 보고, phase.jsonl의 RED→GREEN 전이 기록이 정확한 M3다.
      # 프록시와 정확한 센서를 함께 두면 서로 다른 답을 낸다.

      - name: 검증 일괄 (lint + typecheck + test)
        run: bash scripts/check.sh

      # 하네스 자체 검사 — 서브프로세스·API 키·네트워크 불필요, 초 단위.
      # 이 둘이 CI에 없으면 hook.py 의 fail-OPEN 정당화("사후에 잡힌다")가
      # 성립하지 않는다. 잡아줄 유일한 센서를 아무도 부르지 않기 때문이다.
      - name: 정책 린트 (P1~P14 — 매칭 불가 패턴 · enforced_by 대조 · 반복 대장 미처방 · 바깥 라벨 · 가드 커버리지 · 문서 관할)
        run: node scripts/policy-lint.mjs

      - name: 게이트 음성 시험 (차단해야 할 것을 실제로 차단하는가)
        run: |
          node scripts/policy-lint.mjs --self-test
          node scripts/eval-b.mjs --self-test
          python harness/phase.py self-test

      - name: 훅 자기검사 (게이트가 실제로 allow/deny 를 내는지)
        run: node scripts/hooks-selftest.mjs

      # recurrence R8 — 2026-07-29 배선. 이 검사는 그 전까지 **사람이 손으로 부를
      # 때만** 돌았고, 그래서 같은 원인(값을 바꾸고 재서술하는 문서를 안 씀)으로
      # 6차·7차 재리뷰에서 연속으로 빨개졌다. harness-audit 은 `--full` 을 부르는데
      # 그 모드에서 C2 는 advisory 라 **선행 점검 스킬이 이것을 구조적으로 못 본다.**
      #
      # `--pr` 인 이유: 저장소 전체 낡음을 걸면 첫날부터 모든 PR 이 빨개지고 게이트는
      # 그날로 무시된다. "이 PR 이 건드린 의존만 책임진다"가 게이트를 살려둔다.
      - name: 문서 신선도 (C1·C2·C4·C5·C7 — 이 PR 이 만든 낡음만)
        run: node scripts/doc-freshness.mjs --pr --base origin/${{ github.base_ref || 'main' }}
